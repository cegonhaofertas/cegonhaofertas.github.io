<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">

<meta property="og:title" content="Cegonha Ofertas | Ofertas de bebê todos os dias">

<style>
:root{
  --azul:#17285d; --azul-claro:#d9ecfb; --rosa:#f8708f; --creme:#fff8ec; --verde:#25d366; --verde-esc:#1da851; --texto:#223056;
}
*{box-sizing:border-box;margin:0;padding:0}
html{-webkit-text-size-adjust:100%}
body{font-family:"Segoe UI",system-ui,-apple-system,Roboto,Helvetica,Arial,sans-serif;color:var(--texto);
  background:linear-gradient(180deg,var(--azul-claro) 0,#eaf5fd 340px,var(--creme) 100%);min-height:100vh}
.wrap{max-width:480px;margin:0 auto;padding:28px 16px 40px;text-align:center}
.logo{width:150px;height:150px;border-radius:50%;box-shadow:0 8px 26px rgba(23,40,93,.22);border:4px solid #fff;background:#fff}
h1{margin-top:14px;font-size:1.65rem;color:var(--azul);letter-spacing:-.3px}
.sub{margin-top:4px;color:#4a5a86;font-size:1.02rem}
.btn{display:flex;align-items:center;justify-content:center;gap:10px;margin:22px auto 0;padding:17px 20px;border-radius:16px;
  background:var(--verde);color:#fff;text-decoration:none;font-weight:700;font-size:1.12rem;box-shadow:0 8px 20px rgba(37,211,102,.35);
  transition:transform .12s,background .12s}
.btn:hover{background:var(--verde-esc)}
.btn:active{transform:scale(.98)}
.btn svg{width:26px;height:26px;flex:none}
.nota{margin-top:10px;font-size:.88rem;color:#5b6b95}
.itens{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin-top:26px;text-align:left}
.item{background:#fff;border-radius:14px;padding:12px 14px;font-size:.93rem;font-weight:600;color:var(--azul);box-shadow:0 3px 10px rgba(23,40,93,.08)}
.item span{display:block;font-size:1.25rem;margin-bottom:2px}
.banner{width:100%;border-radius:20px;margin-top:26px;box-shadow:0 8px 26px rgba(23,40,93,.16)}
.rodape{margin-top:26px;font-size:.8rem;color:#6b7aa3;line-height:1.5}
</style>
</head>
<body>
<main class="wrap">
  <img class="logo" src="img/logo.png" alt="Logo da Cegonha Ofertas" width="150" height="150">
  <h1>Cegonha Ofertas</h1>
  <p class="sub">Ofertas de bebê todos os dias!</p>

  <a class="btn" href="https://chat.whatsapp.com/HOZ2CCVl26AK4noePZCMd7" target="_blank" rel="noopener">

    Entrar no grupo do WhatsApp
  </a>
  <p class="nota">Grátis. Você pode silenciar e ver as ofertas quando quiser.</p>

  <div class="itens">
    <div class="item"><span>🏷️</span>Ofertas diárias</div>
    <div class="item"><span>✅</span>Produtos de qualidade</div>
    <div class="item"><span>🛍️</span>Diversas lojas</div>
    <div class="item"><span>💙</span>Tudo para o seu bebê</div>
  </div>

  <img class="banner" src="img/banner.jpg" alt="Cegonha Ofertas: ofertas de bebê todos os dias" width="1000" height="1000" loading="lazy">

  <p class="rodape">Os preços e a disponibilidade podem mudar a qualquer momento.<br>© Cegonha Ofertas</p>
</main>
</body>
</html>
